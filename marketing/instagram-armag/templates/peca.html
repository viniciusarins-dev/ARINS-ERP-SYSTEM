<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Peça ARMAG</title>
<link rel="stylesheet" href="../marca/tokens.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1350px; overflow: hidden; background: var(--ink); }
#peca { position: relative; width: 1080px; height: 1350px; overflow: hidden; color: var(--ice); font-family: Inter, sans-serif;
  background:
    radial-gradient(760px 620px at 92% -6%, rgba(217,164,65,.20), transparent 62%),
    radial-gradient(700px 600px at -10% 108%, rgba(53,221,251,.10), transparent 60%),
    var(--ink); -webkit-font-smoothing: antialiased; }
#peca::after { content: ""; position: absolute; inset: 26px; border: 2px solid rgba(217,164,65,.28); border-radius: 30px; pointer-events: none; }
.topo { position: absolute; top: 64px; left: 76px; right: 76px; display: flex; align-items: center; justify-content: space-between; }
.marca { display: flex; align-items: center; gap: 18px; font-family: Montserrat; font-weight: 800; letter-spacing: .32em; font-size: 26px; color: var(--gold); }
.marca img { width: 64px; height: 64px; object-fit: cover; border-radius: 14px; }
.contador { font-family: Montserrat; font-weight: 700; font-size: 24px; color: var(--mist); letter-spacing: .12em; }
.hl { color: var(--gold); }
.hl2 { color: var(--cyan); }
.titulo { font-family: Anton, Impact, sans-serif; text-transform: uppercase; line-height: 1.04; letter-spacing: .005em; }
.box { position: absolute; left: 76px; right: 76px; overflow: hidden; }
.texto { font-family: Inter; font-weight: 500; font-size: 42px; line-height: 1.38; color: #d9dee3; }
.rodape { position: absolute; bottom: 64px; left: 76px; right: 76px; display: flex; justify-content: space-between; align-items: center;
  font-family: Montserrat; font-weight: 700; font-size: 24px; color: var(--mist); letter-spacing: .06em; }
.rodape .wa { color: var(--ice); }
.barra { width: 120px; height: 8px; border-radius: 8px; background: linear-gradient(90deg, var(--gold), var(--cyan)); margin-bottom: 40px; }
/* capa */
.capa .t { top: 300px; height: 700px; display: flex; flex-direction: column; justify-content: center; }
.capa .titulo { font-size: 128px; }
.capa .texto { margin-top: 40px; color: var(--cyan); font-family: Montserrat; font-weight: 800; font-size: 36px; letter-spacing: .08em; text-transform: uppercase; }
/* conteúdo */
.conteudo .t { top: 230px; height: 860px; display: flex; flex-direction: column; justify-content: center; }
.conteudo .titulo { font-size: 96px; }
.conteudo .texto { margin-top: 44px; }
.conteudo.com-imagem .t { top: 210px; height: 330px; justify-content: flex-start; }
.conteudo.com-imagem .titulo { font-size: 74px; }
.conteudo.com-imagem .texto { margin-top: 18px; font-size: 34px; }
.tela { position: absolute; left: 50%; top: 560px; width: 460px; height: 900px; margin-left: -230px; border-radius: 56px; padding: 16px;
  background: linear-gradient(160deg,#2b2b2b,#0d0d0d 40%,#1a1a1a); box-shadow: 0 0 0 3px #3a3a3a inset, 0 40px 120px rgba(0,0,0,.8), 0 0 0 2px rgba(217,164,65,.35); }
.tela img { width: 100%; height: 100%; object-fit: cover; object-position: top; border-radius: 42px; display: block; }
/* cta */
.cta .t { top: 250px; height: 900px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.cta .logo { width: 300px; height: 300px; object-fit: cover; border-radius: 40px; }
.cta .titulo { font-size: 92px; margin-top: 30px; }
.botao { margin-top: 46px; display: inline-flex; align-items: center; gap: 20px; background: var(--gold); color: #0a0a0a; border-radius: 999px; padding: 30px 56px;
  font-family: Montserrat; font-weight: 900; font-size: 44px; letter-spacing: .03em; text-transform: uppercase; box-shadow: 0 20px 60px rgba(217,164,65,.35); }
.botao svg { width: 50px; height: 50px; }
.fone { margin-top: 34px; font-family: Montserrat; font-weight: 800; font-size: 48px; }
.cta .texto { margin-top: 16px; font-size: 34px; color: var(--mist); }
</style>
</head>
<body>
<div id="peca"></div>
<script>
const ICON_WA = '<svg viewBox="0 0 24 24" fill="#0a0a0a"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.8 2c.1.2.1.4 0 .5l-.4.6c-.1.2-.3.3-.1.6.1.3.6 1.1 1.4 1.8 1 .9 1.8 1.1 2 1.2.3.1.4.1.6-.1l.8-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// *palavra* = dourado, _palavra_ = ciano (pode abranger várias palavras)
const destaque = (s) => esc(s).replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>').replace(/_([^_]+)_/g, '<span class="hl2">$1</span>');

window.desenhar = ({ slide, indice, total, tipo, base }) => {
  const el = document.getElementById('peca');
  const cont = total > 1 ? `<div class="contador">${String(indice + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}</div>` : '';
  const topo = `<div class="topo"><div class="marca"><img src="../marca/escudo.png">ARMAG</div>${cont}</div>`;
  const rodape = `<div class="rodape"><span>Software sob medida · Joinville</span><span class="wa">(47) 98919-1953</span></div>`;
  let corpo = '';
  if (tipo === 'cta') {
    corpo = `<div class="box t"><img class="logo" src="../marca/armag-logo.png">
      <div class="titulo">${destaque(slide.titulo)}</div>
      <div class="botao">${ICON_WA}Chama no WhatsApp</div>
      <div class="fone">(47) 98919-1953</div>
      ${slide.texto ? `<div class="texto">${destaque(slide.texto)}</div>` : '<div class="texto">Peça seu orçamento</div>'}</div>`;
    el.className = 'cta';
    el.innerHTML = topo + corpo;
  } else {
    corpo = `<div class="box t"><div class="barra"></div><div class="titulo">${destaque(slide.titulo)}</div>
      ${slide.texto ? `<div class="texto">${destaque(slide.texto)}</div>` : ''}</div>
      ${slide.imagem ? `<div class="tela"><img src="${base}/${encodeURI(slide.imagem)}"></div>` : ''}`;
    el.className = tipo + (slide.imagem ? ' com-imagem' : '');
    el.innerHTML = topo + corpo + (slide.imagem ? '' : rodape);
  }
  return Promise.all([document.fonts.ready, ...[...el.querySelectorAll('img')].map((i) => i.decode().catch(() => { throw new Error('imagem não carregou: ' + i.src); }))])
    .then(() => {
      const estouro = [...el.querySelectorAll('.box')].some((b) => b.scrollHeight > b.clientHeight + 1 || b.scrollWidth > b.clientWidth + 1);
      return { estouro };
    });
};
</script>
</body>
</html>
