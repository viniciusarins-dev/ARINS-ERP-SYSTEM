<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Clube da Navalha — vídeo curto (primeiro contato)</title>
<style>
@font-face { font-family: "Anton"; src: url(fonts/anton-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Montserrat"; src: url(fonts/montserrat-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Montserrat"; src: url(fonts/montserrat-latin-600-normal.woff2) format("woff2"); font-weight: 600; }
@font-face { font-family: "Montserrat"; src: url(fonts/montserrat-latin-700-normal.woff2) format("woff2"); font-weight: 700; }
@font-face { font-family: "Montserrat"; src: url(fonts/montserrat-latin-800-normal.woff2) format("woff2"); font-weight: 800; }
@font-face { font-family: "Montserrat"; src: url(fonts/montserrat-latin-900-normal.woff2) format("woff2"); font-weight: 900; }
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-400-normal.woff2) format("woff2"); font-weight: 400; }
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-500-normal.woff2) format("woff2"); font-weight: 500; }
@font-face { font-family: "Inter"; src: url(fonts/inter-latin-600-normal.woff2) format("woff2"); font-weight: 600; }

:root { --amarelo: #ffc531; --vermelho: #ff4d57; --branco: #f7f7f5; --cinza: #a3a3a3; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #070707; color: var(--branco);
  font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
.layer { position: absolute; inset: 0; will-change: transform, opacity; }

/* fundo */
#bg { background:
  radial-gradient(900px 900px at 85% 8%, rgba(255,197,49,.10), transparent 60%),
  radial-gradient(800px 800px at 0% 95%, rgba(255,255,255,.05), transparent 60%), #070707; }
#grain { opacity: .07; mix-blend-mode: overlay; pointer-events: none; }
#vignette { background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
#flash { background: #fff; opacity: 0; }
#tint { background: rgba(255, 50, 60, .0); }

/* tipografia publicitária */
.titulo { font-family: Anton, Impact, sans-serif; text-transform: uppercase; line-height: 1.02; letter-spacing: .005em; }
.chamada { font-family: Montserrat, sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; }
.apoio { font-family: Montserrat, sans-serif; font-weight: 600; }
.hl { color: var(--amarelo); }
.hl-red { color: var(--vermelho); }
.w { display: inline-block; will-change: transform, opacity; }

/* bloco de texto centralizado em área segura (topo 230px / base 330px livres) */
.txt { position: absolute; left: 70px; right: 70px; text-align: center; }
.chip { display: inline-flex; align-items: center; gap: 14px; padding: 14px 26px; border-radius: 999px;
  background: var(--amarelo); color: #0a0a0a; font-size: 30px; }
.chip i { width: 12px; height: 12px; border-radius: 50%; background: #0a0a0a; display: inline-block; }
.pill-out { display: inline-block; padding: 18px 32px; border-radius: 999px; border: 3px solid rgba(255,255,255,.85); font-size: 40px; }

/* celular */
.phone { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.phone .frame { position: absolute; left: -26px; top: -26px; border-radius: 96px; background: linear-gradient(160deg,#2b2b2b,#0d0d0d 40%,#1a1a1a);
  box-shadow: 0 0 0 3px #3a3a3a inset, 0 60px 140px rgba(0,0,0,.75), 0 0 0 2px #000; }
.phone .screen { position: absolute; left: 0; top: 0; overflow: hidden; border-radius: 72px; background: #0a0a0a; }
.phone .screen img.clip { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.phone .notch { position: absolute; top: 18px; left: 50%; width: 170px; height: 46px; margin-left: -85px; border-radius: 30px; background: #000; z-index: 5; }

/* destaques nos toques */
.ring { position: absolute; border: 7px solid var(--amarelo); border-radius: 26px; box-shadow: 0 0 0 6px rgba(255,197,49,.25), 0 0 40px rgba(255,197,49,.55); opacity: 0; }
.ripple { position: absolute; width: 80px; height: 80px; margin: -40px 0 0 -40px; border-radius: 50%; background: rgba(255,255,255,.35); border: 4px solid #fff; opacity: 0; }

/* cena 1 — notificações genéricas (não é a interface do sistema) */
.lock { position: absolute; inset: 0; background: radial-gradient(600px 500px at 50% 20%, #1f2a33, #0b0f13 70%); }
.lock .hora { position: absolute; top: 110px; width: 100%; text-align: center; font-family: Inter; font-weight: 600; font-size: 150px; letter-spacing: -.02em; }
.lock .data { position: absolute; top: 280px; width: 100%; text-align: center; font-family: Inter; font-weight: 500; font-size: 34px; color: rgba(255,255,255,.8); }
.notif { position: absolute; left: 34px; right: 34px; height: 150px; border-radius: 40px; padding: 24px 28px; display: flex; gap: 22px;
  background: rgba(40,44,50,.78); backdrop-filter: blur(20px); box-shadow: 0 10px 40px rgba(0,0,0,.4); }
.notif .ic { width: 70px; height: 70px; border-radius: 18px; background: #2fbf71; flex: none; display: grid; place-items: center; }
.notif .ic svg { width: 40px; height: 40px; }
.notif .b { flex: 1; min-width: 0; }
.notif .top { display: flex; justify-content: space-between; font-size: 26px; color: rgba(255,255,255,.7); font-family: Inter; font-weight: 500; }
.notif .de { font-size: 31px; font-weight: 600; margin-top: 4px; font-family: Inter; }
.notif .msg { font-size: 30px; color: rgba(255,255,255,.92); font-family: Inter; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { position: absolute; right: -24px; top: -24px; min-width: 92px; height: 92px; padding: 0 22px; border-radius: 999px; background: var(--vermelho);
  font-family: Montserrat; font-weight: 900; font-size: 50px; display: grid; place-items: center; box-shadow: 0 10px 30px rgba(255,77,87,.5); z-index: 8; }
.busy { position: absolute; left: 140px; right: 140px; top: 760px; height: 340px; border-radius: 44px; background: rgba(255,255,255,.05);
  border: 2px solid rgba(255,255,255,.12); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; }
.busy .lbl { font-family: Montserrat; font-weight: 800; font-size: 32px; letter-spacing: .12em; color: rgba(255,255,255,.75); }
.busy .tm { font-family: Montserrat; font-weight: 900; font-size: 96px; letter-spacing: .02em; }
.busy .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--vermelho); display: inline-block; margin-right: 14px; vertical-align: middle; box-shadow: 0 0 18px var(--vermelho); }

/* benefícios e CTA */
.ben { position: absolute; left: 70px; right: 70px; display: flex; gap: 30px; align-items: center; }
.ben .ck { width: 96px; height: 96px; border-radius: 50%; background: var(--amarelo); flex: none; display: grid; place-items: center; }
.ben .ck svg { width: 54px; height: 54px; }
.ben .tx { font-family: Anton; text-transform: uppercase; font-size: 76px; line-height: 1.14; }
.cta-btn { display: inline-flex; align-items: center; gap: 22px; background: var(--amarelo); color: #0a0a0a; border-radius: 999px; padding: 34px 60px;
  font-family: Montserrat; font-weight: 900; font-size: 58px; letter-spacing: .02em; text-transform: uppercase; position: relative; overflow: hidden;
  box-shadow: 0 20px 60px rgba(255,197,49,.35); }
.cta-btn .shine { position: absolute; top: 0; bottom: 0; width: 140px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent); transform: skewX(-20deg); }
.contato { display: inline-flex; align-items: center; gap: 22px; font-family: Montserrat; font-weight: 800; font-size: 52px; }
.contato .ic { width: 84px; height: 84px; border-radius: 22px; background: #2fbf71; display: grid; place-items: center; }
.contato .ic svg { width: 48px; height: 48px; }
/* versão curta */
.soco { position: absolute; left: 40px; right: 40px; text-align: center; font-family: Anton; text-transform: uppercase; font-size: 142px; line-height: 1.02; white-space: nowrap; }
.soco .x { color: var(--vermelho); }
.risco { position: absolute; left: 50%; top: 52%; height: 14px; background: var(--vermelho); border-radius: 8px; transform-origin: 0 50%; box-shadow: 0 0 24px rgba(255,77,87,.6); }
</style>
</head>
<body>
<div id="stage">
  <div class="layer" id="bg"></div>

  <!-- 1 — GANCHO -->
  <div class="layer" id="s-prob">
    <div class="phone" id="p-phone">
      <div class="frame" id="p-frame"></div>
      <div class="screen" id="p-screen">
        <div class="notch"></div>
        <div class="lock">
          <div class="hora">14:32</div>
          <div class="data">quarta-feira, 11 de novembro</div>
          <div id="notifs"></div>
        </div>
      </div>
      <div class="badge" id="badge">0</div>
    </div>
    <div class="txt titulo" id="t-k1" style="top:170px;font-size:126px"></div>
    <div class="txt titulo" id="t-k2" style="top:200px;font-size:132px"></div>
  </div>

  <!-- 2 — VIRADA -->
  <div class="layer" id="s-sol">
    <div class="txt" id="logo-wrap" style="top:520px"><img id="logo" src="../assets/logo-clube-da-navalha.png" style="height:170px" /></div>
    <div class="txt titulo" id="t-k3a" style="top:780px;font-size:118px"></div>
    <div class="txt titulo" id="t-k3b" style="top:910px;font-size:176px"></div>
  </div>

  <!-- 3 — DEMONSTRAÇÃO RELÂMPAGO (telas reais) -->
  <div class="layer" id="s-demo">
    <div class="phone" id="d-phone">
      <div class="frame" id="d-frame"></div>
      <div class="screen" id="d-screen">
        <img class="clip" id="clip" />
        <div id="marks"></div>
      </div>
    </div>
    <div class="layer" id="d-shade" style="background:linear-gradient(180deg,#070707 0%,#070707 27%,rgba(7,7,7,.85) 30%,rgba(7,7,7,0) 35%)"></div>
    <div id="d-cap" class="txt" style="top:200px"></div>
  </div>

  <!-- 4 — IMPACTO -->
  <div class="layer" id="s-ben">
    <img src="../assets/home.png" id="ben-bg" style="position:absolute;left:-10%;top:-5%;width:120%;filter:blur(30px) brightness(.28);" />
    <div class="soco" id="sem1" style="top:470px">SEM <span class="hl">LIGAÇÃO.</span></div>
    <div class="soco" id="sem2" style="top:770px">SEM <span class="hl">MENSAGEM.</span></div>
    <div class="soco" id="sem3" style="top:1070px">SEM <span class="hl">ESPERA.</span></div>
  </div>

  <!-- 5 — CHAMADA -->
  <div class="layer" id="s-cta">
    <div class="txt titulo" id="c-a" style="top:420px;font-size:136px"></div>
    <div class="txt" id="c-d" style="top:880px"><span class="cta-btn" id="cta-btn" style="font-size:62px">Chama no WhatsApp<span class="shine" id="shine"></span></span></div>
    <div class="txt" id="c-f" style="top:1090px"><span class="contato" style="font-size:60px"><span class="ic"></span><span id="fone"></span></span></div>
    <div class="txt" id="c-g" style="top:1330px"><img src="../assets/logo-clube-da-navalha.png" style="height:110px;opacity:.95" /></div>
  </div>

  <div class="layer" id="tint"></div>
  <div class="layer" id="vignette"></div>
  <svg class="layer" id="grain" width="1080" height="1920"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
  <div class="layer" id="flash"></div>
</div>
<script src="curta.js"></script>
</body>
</html>
